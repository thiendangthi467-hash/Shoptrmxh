<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cửa Hàng Trực Tuyến</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding-bottom: 80px; }
    header { background: #0068ff; color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    .cart-btn { background: #fff; color: #0068ff; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    
    .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .product-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .product-card img { width: 100%; height: 160px; object-fit: cover; }
    .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
    .product-price { color: #e53935; font-weight: 700; margin-bottom: 12px; font-size: 1.1rem; }
    .btn-add { margin-top: auto; background: #0068ff; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-add:hover { background: #0053cc; }

    /* Modal Giỏ hàng */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
    .modal-content { background: #fff; border-radius: 12px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 20px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .close-btn { font-size: 1.5rem; border: none; background: none; cursor: pointer; color: #888; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.95rem; }
    .cart-controls button { width: 26px; height: 26px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
    .cart-total { font-weight: 700; font-size: 1.1rem; margin: 16px 0; text-align: right; color: #e53935; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    .checkout-btn { width: 100%; background: #0068ff; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; }
    
    /* Floating Contact Buttons */
    .floating-contacts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 90; }
    .floating-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; font-size: 0.75rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .btn-zalo { background: #0068ff; }
    .btn-fb { background: #0084ff; }
  </style>
</head>
<body>

  <header>
    <h1>Cửa Hàng Tiện Ích</h1>
    <button class="cart-btn" onclick="openCart()">Giỏ hàng (<span id="cart-count">0</span>)</button>
  </header>

  <div class="container">
    <div class="products" id="product-list"></div>
  </div>

  <!-- Modal Giỏ hàng & Thanh toán -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Giỏ hàng của bạn</h3>
        <button class="close-btn" onclick="closeCart()">&times;</button>
      </div>

      <div id="cart-items"></div>
      <div class="cart-total" id="cart-total">Tổng: 0đ</div>

      <form id="order-form" onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>Tên người nhận:</label>
          <input type="text" id="cust-name" required placeholder="Nguyễn Văn A" />
        </div>
        <div class="form-group">
          <label>Số điện thoại:</label>
          <input type="tel" id="cust-phone" required placeholder="0901234567" />
        </div>
        <div class="form-group">
          <label>Địa chỉ nhận hàng:</label>
          <input type="text" id="cust-address" required placeholder="Số nhà, đường, phường/xã, quận/huyện" />
        </div>
        <div class="form-group">
          <label>Ghi chú (tuỳ chọn):</label>
          <textarea id="cust-note" rows="2" placeholder="Giao giờ hành chính..."></textarea>
        </div>
        <button type="submit" class="checkout-btn">Gửi đơn qua Zalo</button>
      </form>
    </div>
  </div>

  <!-- Nút hỗ trợ nhanh Zalo & FB -->
  <div class="floating-contacts">
    <a href="https://zalo.me/0901234567" target="_blank" rel="noopener noreferrer" class="floating-btn btn-zalo">Zalo</a>
    <a href="https://m.me/yourfanpage" target="_blank" rel="noopener noreferrer" class="floating-btn btn-fb">Chat</a>
  </div>

  <script>
    // 1. Cấu hình số điện thoại nhận đơn Zalo (thay bằng số của bạn)
    const SHOP_ZALO_PHONE = "0901234567";

    // 2. Danh sách sản phẩm (có thể thêm bớt dễ dàng tại đây)
    const products = [
      { id: 1, name: "Gói Dịch Vụ Cơ Bản", price: 150000, img: "https://picsum.photos/300/200?random=1" },
      { id: 2, name: "Gói Dịch Vụ Cao Cấp", price: 350000, img: "https://picsum.photos/300/200?random=2" },
      { id: 3, name: "Tài Khoản Chuẩn VIP", price: 200000, img: "https://picsum.photos/300/200?random=3" },
      { id: 4, name: "Combo Hỗ Trợ 1 Tháng", price: 500000, img: "https://picsum.photos/300/200?random=4" }
    ];

    let cart = [];

    // Hiển thị sản phẩm
    function renderProducts() {
      const container = document.getElementById("product-list");
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" alt="${p.name}" />
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-price">${p.price.toLocaleString("vi-VN")}đ</div>
            <button class="btn-add" onclick="addToCart(${p.id})">Thêm vào giỏ</button>
          </div>
        </div>
      `).join("");
    }

    function addToCart(id) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty++;
      } else {
        const prod = products.find(p => p.id === id);
        cart.push({ ...prod, qty: 1 });
      }
      updateCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCart();
    }

    function updateCart() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cart-count").innerText = totalCount;

      const cartItems = document.getElementById("cart-items");
      if (cart.length === 0) {
        cartItems.innerHTML = "<p style='color: #888;'>Giỏ hàng đang trống.</p>";
      } else {
        cartItems.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              <small>${item.price.toLocaleString("vi-VN")}đ x ${item.qty}</small>
            </div>
            <div class="cart-controls">
              <button type="button" onclick="changeQty(${item.id}, -1)">-</button>
              <span style="margin: 0 8px;">${item.qty}</span>
              <button type="button" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `).join("");
      }

      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      document.getElementById("cart-total").innerText = `Tổng: ${totalPrice.toLocaleString("vi-VN")}đ`;
    }

    function openCart() {
      document.getElementById("cart-modal").style.display = "flex";
    }

    function closeCart() {
      document.getElementById("cart-modal").style.display = "none";
    }

    // Cơ chế gửi đơn: copy nội dung đơn và mở cửa sổ Zalo với số người bán
    function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) {
        alert("Giỏ hàng của bạn đang trống!");
        return;
      }

      const name = document.getElementById("cust-name").value.trim();
      const phone = document.getElementById("cust-phone").value.trim();
      const address = document.getElementById("cust-address").value.trim();
      const note = document.getElementById("cust-note").value.trim();
      const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

      const itemsText = cart.map(i => `- ${i.name} x${i.qty}: ${(i.price * i.qty).toLocaleString("vi-VN")}đ`).join("\n");
      
      const orderMessage = 
`🛒 ĐƠN HÀNG MỚI
Khách hàng: ${name}
Số điện thoại: ${phone}
Địa chỉ: ${address}
${note ? `Ghi chú: ${note}\n` : ""}
Chi tiết đơn:
${itemsText}
---------------------
Tổng cộng: ${total.toLocaleString("vi-VN")}đ`;

      // Copy nội dung vào Clipboard người dùng để họ tiện paste khi cửa sổ Zalo mở lên
      navigator.clipboard.writeText(orderMessage).then(() => {
        alert("Đơn hàng đã được sao chép vào bộ nhớ tạm! Hệ thống sẽ chuyển hướng bạn tới Zalo chủ shop để dán và gửi đơn.");
        window.open(`https://zalo.me/${SHOP_ZALO_PHONE}`, "_blank");
      }).catch(() => {
        window.open(`https://zalo.me/${SHOP_ZALO_PHONE}`, "_blank");
      });
    }

    renderProducts();
  </script>
</body>
</html>
