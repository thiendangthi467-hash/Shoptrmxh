<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Dịch Vụ MXH TikTok, AI & Shopee Tự Động</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Firebase SDK (Hệ thống Tài khoản thật & Dữ liệu đám mây miễn phí) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #050507;
      color: #e2e8f0;
      padding-bottom: 95px;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Header Cyber */
    header {
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 8px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f2fe, #4facfe, #fa709a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-header {
      background: #111420;
      color: #00f2fe;
      border: 1px solid #00f2fe;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-header:hover {
      background: #00f2fe;
      color: #000;
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.6);
    }
    .btn-register-top {
      background: rgba(0, 230, 118, 0.14);
      color: #00e676;
      border-color: #00e676;
    }
    .btn-register-top:hover {
      background: #00e676;
      color: #000;
      box-shadow: 0 0 14px rgba(0, 230, 118, 0.6);
    }
    .btn-admin {
      background: linear-gradient(135deg, #ffc107, #ff9800);
      color: #000;
      border: none;
      font-weight: 800;
    }
    .btn-admin:hover {
      background: linear-gradient(135deg, #ffd54f, #ffb300);
      color: #000;
      box-shadow: 0 0 14px rgba(255, 193, 7, 0.6);
    }
    .btn-orders {
      background: rgba(155, 81, 224, 0.15);
      color: #d8b4fe;
      border: 1px solid #9b51e0;
    }
    .btn-orders:hover {
      background: #9b51e0;
      color: #fff;
    }
    .badge-count {
      background: #ff0844;
      color: #fff;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 800;
    }
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      color: #00f2fe;
      font-weight: 600;
    }
    .admin-pill {
      background: #ffc107;
      color: #000;
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 8px;
      font-weight: 900;
    }
    .verified-pill {
      background: rgba(0, 230, 118, 0.2);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.5);
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 8px;
      font-weight: 800;
    }

    /* Thanh thông báo mã giảm giá */
    .promo-banner-bar {
      background: linear-gradient(90deg, rgba(254, 44, 85, 0.2), rgba(0, 242, 254, 0.2));
      border-bottom: 1px solid rgba(0, 242, 254, 0.25);
      padding: 8px 14px;
      text-align: center;
      font-size: 0.82rem;
      color: #f8fafc;
    }
    .promo-code-chip {
      display: inline-block;
      background: #ff0844;
      color: #fff;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin: 0 4px;
    }

    /* Container chung */
    .container {
      max-width: 1080px;
      margin: 22px auto;
      padding: 0 16px;
    }
    .section-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 14px;
      color: #fff;
      border-left: 4px solid #00f2fe;
      padding-left: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Bộ lọc danh mục */
    .category-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: #111420;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #00f2fe;
      color: #050507;
      border-color: #00f2fe;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
    }
    .tab-tiktok.active {
      background: linear-gradient(135deg, #fe2c55, #25f4ee) !important;
      color: #fff !important;
      border-color: #fe2c55 !important;
    }
    .tab-shopee.active {
      background: #ee4d2d !important;
      color: #fff !important;
      border-color: #ee4d2d !important;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 18px;
    }
    .product-card {
      background: #0d1117;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      transition: 0.25s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: #00f2fe;
      box-shadow: 0 8px 24px rgba(0, 242, 254, 0.15);
    }
    .product-banner {
      height: 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      text-align: center;
      padding: 6px;
      position: relative;
    }
    .banner-tiktok { background: linear-gradient(135deg, #010101, #fe2c55); border-bottom: 2px solid #25f4ee; }
    .banner-clone { background: linear-gradient(135deg, #1e3c72, #2a5298); }
    .banner-plus { background: linear-gradient(135deg, #7b2ff7, #f107a3); }
    .banner-pro { background: linear-gradient(135deg, #000428, #004e92); border-bottom: 2px solid #ffd700; }
    .banner-shopee-50 { background: linear-gradient(135deg, #ff5722, #ff9800); }
    .banner-shopee-80 { background: linear-gradient(135deg, #ee4d2d, #ff3366); }
    .banner-shopee-100 { background: linear-gradient(135deg, #d32f2f, #7b1fa2); border-bottom: 2px solid #ffeb3b; }

    .stock-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 8px;
      margin-bottom: 10px;
      width: fit-content;
    }
    .stock-available {
      background: rgba(0, 230, 118, 0.12);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.35);
    }
    .stock-out {
      background: rgba(255, 82, 82, 0.14);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.35);
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .product-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .product-desc {
      font-size: 0.82rem;
      color: #8b949e;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .product-price {
      color: #00e5ff;
      font-weight: 800;
      font-size: 1.18rem;
      margin-bottom: 14px;
    }
    .btn-buynow {
      margin-top: auto;
      background: linear-gradient(90deg, #00f2fe, #2f80ed);
      color: #000;
      border: none;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.92rem;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-buynow:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.6);
      transform: translateY(-2px);
      color: #fff;
    }
    .btn-buynow:disabled {
      background: #21262d;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Modal Dark Theme */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(5px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .modal-content {
      background: #0d1117;
      color: #fff;
      border-radius: 18px;
      width: 100%;
      max-width: 490px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid rgba(0, 242, 254, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
    }
    .modal-content.modal-wide {
      max-width: 820px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .close-btn {
      font-size: 1.5rem;
      border: none;
      background: none;
      cursor: pointer;
      color: #888;
    }
    .close-btn:hover { color: #fff; }
    .form-group { margin-bottom: 11px; text-align: left; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #8b949e;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #00f2fe;
    }

    /* Tabs Auth */
    .auth-switch-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
      background: #161b22;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #30363d;
    }
    .auth-tab-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .auth-tab-btn.active {
      background: linear-gradient(90deg, #00f2fe, #2f80ed);
      color: #050507;
    }

    .server-mode-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.35;
    }
    .mode-cloud {
      background: rgba(0, 230, 118, 0.12);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
    }
    .mode-local {
      background: rgba(255, 193, 7, 0.12);
      color: #ffd54f;
      border: 1px solid rgba(255, 193, 7, 0.4);
    }

    .verify-pending-box {
      background: #0b1623;
      border: 1px solid #00f2fe;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .link-btn {
      background: none;
      border: none;
      color: #00f2fe;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Mã giảm giá */
    .promo-input-row {
      display: flex;
      gap: 8px;
    }
    .promo-input-row input {
      flex: 1;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
    }
    .btn-apply-promo {
      background: linear-gradient(135deg, #fe2c55, #ff9800);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .promo-msg {
      font-size: 0.78rem;
      margin-top: 6px;
      font-weight: 600;
    }
    .promo-success { color: #00e676; }
    .promo-error { color: #ff5252; }
    .promo-info { color: #00f2fe; }

    .price-summary-box {
      background: #161b22;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #30363d;
      font-size: 0.88rem;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .price-row.total {
      border-top: 1px dashed #30363d;
      padding-top: 6px;
      margin-top: 6px;
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffeb3b;
    }

    .checkout-btn {
      width: 100%;
      background: linear-gradient(90deg, #00f2fe, #2f80ed);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.94rem;
      margin-top: 8px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .checkout-btn:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(0, 242, 254, 0.5);
    }
    .checkout-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Hộp giao hàng tự động */
    .delivered-box {
      background: #091318;
      border: 1px dashed #00e676;
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
      text-align: left;
    }
    .delivered-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #050507;
      border: 1px solid #30363d;
      color: #00f2fe;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 0.84rem;
      word-break: break-all;
      margin: 6px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .btn-copy-small {
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Thanh tiến độ đơn tự chạy */
    .progress-wrap {
      background: #161b22;
      border-radius: 99px;
      height: 10px;
      width: 100%;
      overflow: hidden;
      margin-top: 6px;
      border: 1px solid #30363d;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00f2fe, #00e676);
      transition: width 0.4s ease;
    }

    /* Danh sách đơn hàng & Admin */
    .order-item-card {
      background: #111521;
      border: 1px solid #262c36;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.84rem;
    }
    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .status-tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .status-done {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.4);
    }
    .status-running {
      background: rgba(0, 242, 254, 0.15);
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.4);
    }
    .status-locked {
      background: rgba(255, 82, 82, 0.16);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.45);
    }

    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .admin-stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .admin-stat-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: #00f2fe;
      margin-top: 4px;
    }
    .admin-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .admin-tab-btn {
      background: #161b22;
      color: #94a3b8;
      border: 1px solid #30363d;
      padding: 7px 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .admin-tab-btn.active {
      background: #ffc107;
      color: #000;
      border-color: #ffc107;
    }
    .admin-settings-card {
      background: #111521;
      border: 1px solid #262c36;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .admin-settings-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffc107;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 10px;
      font-size: 0.84rem;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    /* KHUNG AI CHATBOT */
    #ai-chat-toggle {
      position: fixed;
      bottom: 22px;
      left: 18px;
      background: linear-gradient(135deg, #00f2fe, #2f80ed);
      color: #050507;
      border: none;
      border-radius: 50px;
      padding: 11px 16px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.45);
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #ai-chat-box {
      position: fixed;
      bottom: 75px;
      left: 18px;
      width: 350px;
      max-width: 92vw;
      height: 450px;
      background: #0d1117;
      border: 1px solid rgba(0, 242, 254, 0.45);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 160;
    }
    .chat-hidden { display: none !important; }
    .chat-header {
      background: #161b22;
      color: #00f2fe;
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .chat-header button {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
    }
    .chat-quick-chips {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      background: #0b0e14;
      border-bottom: 1px solid #21262d;
    }
    .chip-btn {
      background: #161b22;
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }
    .bot-msg, .user-msg {
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 86%;
      line-height: 1.45;
      white-space: pre-line;
    }
    .bot-msg {
      background: #161b22;
      color: #e2e8f0;
      align-self: flex-start;
      border: 1px solid #30363d;
    }
    .user-msg {
      background: #00f2fe;
      color: #050507;
      font-weight: 600;
      align-self: flex-end;
    }
    .chat-input-area {
      display: flex;
